Name: Sarfy
Summary: Offline expense tracking and monthly budgeting
Description: |
  Sarfy is a privacy-minded expense tracker for recording expenses,
  reviewing spending summaries, setting a monthly budget, choosing a
  currency and color theme, and exporting expense records as CSV. Data
  is stored locally for offline use. The application is available in
  Arabic and English. All features are available without payment; an
  optional voluntary donation is offered in the app.

